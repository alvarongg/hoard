<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H.O.A.R.D.</title>
    <!-- Inline script to apply theme before first paint to prevent flash -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('hoard.theme');
          var preference = stored === 'light' || stored === 'dark' || stored === 'auto' ? stored : 'auto';
          var theme = preference;
          if (preference === 'auto') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // localStorage not available, default to light
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
